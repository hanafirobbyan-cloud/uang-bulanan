<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uang Bulanan</title>
  <meta name="description" content="Atur uang kiriman bulanan supaya cukup sampai transfer berikutnya.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">

  <!-- iPhone "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Uang">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <!-- All paths are relative (./) so the app also works in a sub-folder like /uang-bulanan/ -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="term-head">
      <div class="statusbar">
        <span class="sb-brand">Uang Bulanan</span>
        <span class="sb-mode" id="sb-mode">Mode Hati-hati</span>
        <span class="sb-net" id="sb-net">● Online</span>
        <span class="sb-clock" id="sb-clock" role="timer" aria-label="Jam WIB">--:--:-- WIB</span>
      </div>
      <form class="cmdline" id="cmdline" role="search" novalidate>
        <label class="cmd-prompt" for="cmd" aria-label="Perintah">&gt;</label>
        <div class="cmd-field">
          <input id="cmd" class="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="Ketik kode, mis. BER" role="combobox" aria-expanded="false" aria-controls="cmd-list" aria-autocomplete="list" aria-describedby="cmd-msg">
          <span class="cmd-cursor" aria-hidden="true"></span>
        </div>
        <button type="submit" class="btn btn-go">GO</button>
        <ul id="cmd-list" class="cmd-list" role="listbox" aria-label="Saran perintah" hidden></ul>
        <p id="cmd-msg" class="cmd-msg" role="status" hidden></p>
      </form>
      <div class="ticker" id="ticker" aria-hidden="true"><div class="ticker-track" id="ticker-track"></div></div>
    </header>

    <nav class="nav" aria-label="Menu utama">
      <span class="nav-indicator" aria-hidden="true"></span>
      <a class="nav-item" href="#/beranda" data-route="beranda"><kbd>F1</kbd><span class="nav-code">BER</span><span class="nav-name">Beranda</span></a>
      <a class="nav-item" href="#/pengeluaran" data-route="pengeluaran"><kbd>F2</kbd><span class="nav-code">KLR</span><span class="nav-name">Pengeluaran</span></a>
      <a class="nav-item" href="#/rencana" data-route="rencana"><kbd>F3</kbd><span class="nav-code">RNC</span><span class="nav-name">Rencana Cukup</span></a>
      <a class="nav-item" href="#/masuk" data-route="masuk"><kbd>F4</kbd><span class="nav-code">MSK</span><span class="nav-name">Jadwal Uang Masuk</span></a>
      <button type="button" class="nav-item" data-action="menu" aria-haspopup="dialog"><kbd>F5</kbd><span class="nav-code">LAIN</span><span class="nav-name">Semua menu</span></button>
      <a class="nav-item nav-extra" href="#/simulasi" data-route="simulasi"><kbd>F6</kbd><span class="nav-code">SIM</span><span class="nav-name">Simulasi</span></a>
      <a class="nav-item nav-extra" href="#/ringkasan" data-route="ringkasan"><kbd>F7</kbd><span class="nav-code">RGK</span><span class="nav-name">Ringkasan</span></a>
      <a class="nav-item nav-extra" href="#/pengaturan" data-route="pengaturan"><kbd>F8</kbd><span class="nav-code">ATR</span><span class="nav-name">Pengaturan</span></a>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Versi baru tersedia.</span>
    <button type="button" id="update-reload" class="btn btn-small btn-primary">Muat ulang</button>
  </div>
  <div id="toasts" class="toasts" aria-live="polite" popover="manual"></div>

  <noscript>
    <p class="noscript">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di pengaturan browser.</p>
  </noscript>
</body>
</html>
